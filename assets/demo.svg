<text class="l" x="376" y="23" fill="#8b949e" text-anchor="middle">python -m agentattest.demo</text>
<text class="l r0" x="18" y="67" fill="#e6edf3" font-weight="bold">1. The agent says it is done, and shows nothing.</text>
<text class="l r1" x="18" y="88" fill="#8b949e">--------------------------------------------------------------------</text>
<text class="l r2" x="18" y="109" fill="#79c0ff">  | I fixed the parser bug. All tests pass.</text>
<text class="l r3" x="18" y="130" fill="#8b949e">--------------------------------------------------------------------</text>
<text class="l r4" x="18" y="151" fill="#f85149" font-weight="bold">  -&gt; REFUSED (exit 2)</text>
<text class="l r5" x="18" y="172" fill="#f85149">     Turn refused: completion claim(s) with no evidence in the same turn.</text>
<text class="l r6" x="18" y="193" fill="#f85149">       x line 1: completion claim 'fixed' with no nearby evidence  (I fixed the parser</text>
<text class="l r7" x="18" y="214" fill="#f85149">         bug. All tests pass.)</text>
<text class="l r8" x="18" y="235" fill="#c9d1d9">     Show the proof (command output, exit code, test result, or file and snippet), or</text>
<text class="l r9" x="18" y="256" fill="#c9d1d9">       soften the claim. A dry run proves wiring, not correctness.</text>
<text class="l r10" x="18" y="277" fill="#8b949e"></text>
<text class="l r11" x="18" y="298" fill="#e6edf3" font-weight="bold">2. Same claim, with the receipt attached.</text>
<text class="l r12" x="18" y="319" fill="#8b949e">--------------------------------------------------------------------</text>
<text class="l r13" x="18" y="340" fill="#79c0ff">  | I fixed the parser bug.</text>
<text class="l r14" x="18" y="361" fill="#79c0ff">  | ```</text>
<text class="l r15" x="18" y="382" fill="#79c0ff">  | 56 passed in 0.14s</text>
<text class="l r16" x="18" y="403" fill="#79c0ff">  | ```</text>
<text class="l r17" x="18" y="424" fill="#79c0ff">  | All tests pass.</text>
<text class="l r18" x="18" y="445" fill="#8b949e">--------------------------------------------------------------------</text>
<text class="l r19" x="18" y="466" fill="#3fb950" font-weight="bold">  -&gt; allowed (exit 0)</text>
<text class="l r20" x="18" y="487" fill="#8b949e"></text>
<text class="l r21" x="18" y="508" fill="#e6edf3" font-weight="bold">3. Honest uncertainty is left alone.</text>
<text class="l r22" x="18" y="529" fill="#8b949e">--------------------------------------------------------------------</text>
<text class="l r23" x="18" y="550" fill="#79c0ff">  | This should fix the parser bug, but I have not run the suite yet.</text>
<text class="l r24" x="18" y="571" fill="#8b949e">--------------------------------------------------------------------</text>
<text class="l r25" x="18" y="592" fill="#3fb950" font-weight="bold">  -&gt; allowed (exit 0)</text>
</svg>
