inear infinite}@keyframes r16{0%,34.92%{opacity:0}35.52%,98%{opacity:1}100%{opacity:0}}.r16{opacity:0;animation:r16 25.2s linear infinite}@keyframes r17{0%,37.1%{opacity:0}37.7%,98%{opacity:1}100%{opacity:0}}.r17{opacity:0;animation:r17 25.2s linear infinite}@keyframes r18{0%,39.29%{opacity:0}39.89%,98%{opacity:1}100%{opacity:0}}.r18{opacity:0;animation:r18 25.2s linear infinite}@keyframes r19{0%,41.47%{opacity:0}42.07%,98%{opacity:1}100%{opacity:0}}.r19{opacity:0;animation:r19 25.2s linear infinite}@keyframes r20{0%,43.65%{opacity:0}44.25%,98%{opacity:1}100%{opacity:0}}.r20{opacity:0;animation:r20 25.2s linear infinite}@keyframes r21{0%,45.83%{opacity:0}46.43%,98%{opacity:1}100%{opacity:0}}.r21{opacity:0;animation:r21 25.2s linear infinite}@keyframes r22{0%,48.02%{opacity:0}48.62%,98%{opacity:1}100%{opacity:0}}.r22{opacity:0;animation:r22 25.2s linear infinite}@keyframes r23{0%,50.2%{opacity:0}50.8%,98%{opacity:1}100%{opacity:0}}.r23{opacity:0;animation:r23 25.2s linear infinite}@keyframes r24{0%,52.38%{opacity:0}52.98%,98%{opacity:1}100%{opacity:0}}.r24{opacity:0;animation:r24 25.2s linear infinite}@keyframes r25{0%,54.56%{opacity:0}55.16%,98%{opacity:1}100%{opacity:0}}.r25{opacity:0;animation:r25 25.2s linear infinite}@keyframes r26{0%,56.75%{opacity:0}57.35%,98%{opacity:1}100%{opacity:0}}.r26{opacity:0;animation:r26 25.2s linear infinite}@keyframes r27{0%,58.93%{opacity:0}59.53%,98%{opacity:1}100%{opacity:0}}.r27{opacity:0;animation:r27 25.2s linear infinite}@keyframes r28{0%,61.11%{opacity:0}61.71%,98%{opacity:1}100%{opacity:0}}.r28{opacity:0;animation:r28 25.2s linear infinite}@keyframes r29{0%,63.29%{opacity:0}63.89%,98%{opacity:1}100%{opacity:0}}.r29{opacity:0;animation:r29 25.2s linear infinite}@keyframes r30{0%,65.48%{opacity:0}66.08%,98%{opacity:1}100%{opacity:0}}.r30{opacity:0;animation:r30 25.2s linear infinite}@keyframes r31{0%,67.66%{opacity:0}68.26%,98%{opacity:1}100%{opacity:0}}.r31{opacity:0;animation:r31 25.2s linear infinite}@keyframes r32{0%,69.