name: Publish to PyPI

# Publishes ONLY when a GitHub release is published -- never on push. Uses
# PyPI trusted publishing (OIDC): no long-lived token exists anywhere to
# leak. PyPI trusts this exact repo + workflow + environment combination,
# configured at pypi.org/manage/account/publishing/.
on:
  release:
    types: [published]
  # Manual trigger. Added 2026-08-08 after a re-run of a failed publish used
  # the workflow as it existed AT THE TAG -- which predated the fix being
  # re-run. Without this, correcting a publishing problem costs a whole new
  # release, and the version number becomes a log of infrastructure mistakes.
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build
      # The wheel that gets uploaded is the wheel that got smoke-tested,
      # not a sibling built from the same tree.
      - run: |
          python -m pip install dist/*.whl
          python -c "import claimproof; print('installs as', claimproof.__version__)"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # trusted publishing: a short-lived identity proof
    env:
      # The `secrets` context is NOT available in a step's `if:` -- it silently
      # evaluates empty there, so the token branch would never fire and the
      # failure would look like "trusted publishing is still broken". Job-level
      # env CAN read secrets, so the presence check is computed here once.
      HAS_TOKEN: ${{ secrets.PYPI_API_TOKEN != '' }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      # Two routes, and whichever is configured wins. Trusted publishing is the
      # better one -- no long-lived secret exists to leak -- but it requires a
      # pending publisher on PyPI whose five fields match this workflow exactly,
      # and a single mismatched field fails with a message that does not say
      # which one. A token is one paste in a browser and cannot half-match.
      #
      # So: if PYPI_API_TOKEN is set, use it. If not, fall back to trusted
      # publishing. Neither path is a silent default -- the step name says which
      # ran, so nobody has to guess afterwards which credential was used.
      - name: Publish with an API token
        if: env.HAS_TOKEN == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}

      - name: Publish with trusted publishing (no token configured)
        if: env.HAS_TOKEN != 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
