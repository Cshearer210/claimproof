name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # Both operating systems on purpose. The worst defect this library exists to
    # catch was a checker whose paths only existed on Linux: on Windows it scanned
    # nothing, reported CLEAN, and exited 0 for months. A single-OS matrix would
    # not have caught it.
    name: test ${{ matrix.os }} py${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # No `||` fallback here on purpose. The first version of this file used
      # `pip install -e ".[dev]" || pip install -e . pytest`. The `dev` extra did
      # not exist, so pip warned and exited 0, the fallback never ran, and every
      # job failed with "No module named pytest". A step that appears to succeed
      # while doing nothing is the exact failure this project exists to catch.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Confirm pytest is actually installed
        run: python -m pytest --version

      - name: Test
        run: python -m pytest

      # The published finding rests on this script, so its guards are CI's
      # problem too. It measures 73,269 agent runs and its first real run died
      # mid-download while reporting success -- a number from a tool that
      # cannot detect its own truncated input is not a measurement. The
      # selftest forces each guard to fail on purpose; no network, ~2 seconds.
      - name: The measurement script's guards can still fail
        run: python tools/measure_unbacked_claims.py --selftest

  # The job that matters most to anyone who installs this.
  #
  # Everything above tests the SOURCE TREE. A package can pass every one of those
  # and still be broken on `pip install`, because the wheel is built by different
  # rules than the repo layout: a missing py.typed, a package left out of the
  # build config, a data file present locally and absent from the distribution.
  # Those failures only ever appear on someone else's machine.
  #
  # So this builds the real artifacts, installs the WHEEL into a clean
  # environment, and runs the suite from a directory where the source tree is not
  # importable. If this passes, `pip install claimproof` works.
  installed:
    name: wheel installs and works from clean env (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Install the wheel into a clean environment
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/clean"
          if [ -f "$RUNNER_TEMP/clean/bin/python" ]; then
            PY="$RUNNER_TEMP/clean/bin/python"
          else
            PY="$RUNNER_TEMP/clean/Scripts/python.exe"
          fi
          echo "CLEANPY=$PY" >> "$GITHUB_ENV"
          "$PY" -m pip install --upgrade pip pytest
          "$PY" -m pip install dist/*.whl

      - name: Import and run from OUTSIDE the source tree
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/elsewhere"
          cd "$RUNNER_TEMP/elsewhere"
          "$CLEANPY" -c "
          import claimproof
          assert 'site-packages' in claimproof.__file__, claimproof.__file__
          from claimproof import Gate, Case, Finding, Harness, SelftestError
          from claimproof import ClaimBasis, Evidence, Status, BasisError
          from claimproof import Coverage, CoverageError, Diff, Entry
          from claimproof.gates import UnbackedClaims, TypedScope, SilentSkip
          from claimproof.hooks import stop_hook, pre_tool_use_hook, gate_invariant
          g = UnbackedClaims()
          assert g.verify()
          assert g.check('It works.'), 'installed package failed to flag an unbacked claim'
          assert g.check('It works. exit=0') == [], 'installed package false-positived'
          assert ClaimBasis.selftest(echo=False), 'installed ClaimBasis cannot prove itself'
          assert Coverage.selftest(echo=False), 'installed Coverage cannot prove itself'
          t = TypedScope(); assert t.verify()
          assert t.check('roots = [\"/srv/a\", \"/opt/b\"]'), 'TypedScope missed a typed population'
          assert t.check('LOGFILE = \"/var/log/app.log\"') == [], 'TypedScope false-positived'
          s = SilentSkip(); assert s.verify()
          swallowed = 'def check():' + chr(10) + '    try:' + chr(10) + '        return verify()' + chr(10) + '    except Exception:' + chr(10) + '        return True'
          honest = swallowed.replace('return True', 'return False')
          assert s.check(swallowed), 'SilentSkip missed a swallowed check'
          assert s.check(honest) == [], 'SilentSkip false-positived'
          print('installed package: public API reachable and behaving')
          "

      - name: A partial scan must not exit 0 from the installed package
        shell: bash
        run: |
          cd "$RUNNER_TEMP/elsewhere"
          if "$CLEANPY" -m claimproof.coverage; then
            echo "FAIL: 2 of 7 examined with 0 broken exited 0"
            exit 1
          fi
          echo "installed package refused to call a partial scan clean"

      - name: The installed ClaimBasis must still catch a claim going stale
        shell: bash
        run: |
          cd "$RUNNER_TEMP/elsewhere"
          echo green > proof.txt
          "$CLEANPY" -m claimproof.basis --store c.json --record "the suite passes" --evidence proof.txt
          "$CLEANPY" -m claimproof.basis --store c.json
          echo red > proof.txt
          if "$CLEANPY" -m claimproof.basis --store c.json; then
            echo "FAIL: the installed package did not reopen a claim whose evidence changed"
            exit 1
          fi
          echo "installed package reopened a stale claim, exit non-zero as required"

      - name: The advertised demo command must work
        shell: bash
        run: cd "$RUNNER_TEMP/elsewhere" && "$CLEANPY" -m claimproof.demo

      - name: python -m claimproof must work too
        shell: bash
        run: cd "$RUNNER_TEMP/elsewhere" && "$CLEANPY" -m claimproof

      - name: py.typed must ship, or downstream type checking silently does nothing
        shell: bash
        run: |
          "$CLEANPY" -c "
          import importlib.util, pathlib
          spec = importlib.util.find_spec('claimproof')
          p = pathlib.Path(spec.origin).parent / 'py.typed'
          assert p.exists(), 'py.typed missing from the installed package'
          print('py.typed ships:', p)
          "

      - name: Run the test suite against the INSTALLED package
        shell: bash
        run: |
          cp -r tests "$RUNNER_TEMP/elsewhere/tests"
          cd "$RUNNER_TEMP/elsewhere"
          "$CLEANPY" -m pytest tests -q

  fresh-eyes:
    name: a stranger following the README gets a working library
    runs-on: ubuntu-latest

    # The `installed` job proves the CODE works from a clean install: it runs the
    # test suite from outside the source tree. This proves the PRODUCT does --
    # it executes what the README actually tells a newcomer to type. The two
    # fail independently, because documentation rots on its own schedule.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install --upgrade pip build

      - name: The rehearsal's own guards can still fail
        run: python tools/fresh_eyes.py --selftest

      - name: Be the stranger
        run: python tools/fresh_eyes.py

  # The second package in this repo. It has its own tests, its own dependencies
  # and its own reasons to break, so it gets its own job rather than being folded
  # into the matrix above -- a failure here must name deadcanary, not look like
  # claimproof going red.
  deadcanary:
    name: deadcanary ${{ matrix.os }} py${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.13"]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Installed from THIS checkout, not from PyPI, so the seam between the two
      # packages is tested as it is written here rather than as it was published.
      - name: Install both halves from this repo
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install -e ./packages/deadcanary[dev]

      - name: deadcanary's own suite
        run: python -m pytest packages/deadcanary/tests -q

      # The seam itself: the gate deadcanary contributes has to satisfy the same
      # contract this library imposes on everyone else -- one case it must catch,
      # one it must leave alone -- or it cannot be used at all.
      - name: the contributed gate proves itself in both directions
        run: |
          python -c "from deadcanary.gate import GreenTestsUnproven; print(GreenTestsUnproven().verify())"

  # THE TWO CHECKS THE SUBTREE MERGE NEARLY LOST.
  #
  # deadcanary arrived carrying its own .github/workflows/ci.yml, which GitHub
  # does not run: only workflows at the REPOSITORY ROOT execute. So the moment it
  # moved in here, the check that proves the demo still finds its planted dead
  # canaries, and the one that types what its README says, silently stopped
  # running -- while the file sat in the tree looking exactly like coverage.
  # That file is deleted in the same commit as this. A workflow that cannot run
  # is worse than no workflow, because it reads as protection.
  deadcanary-demo:
    name: the deadcanary demo still finds its planted dead canaries
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/deadcanary
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e .[dbt]
      - name: build the demo warehouse
        run: cd demo && dbt build --profiles-dir .
      # Two canaries are planted in demo/ on purpose. If this stops finding
      # exactly two, either the tool broke or the demo did -- and either way the
      # README is lying to everyone who reads it.
      #
      # `--attest` rides along on the SAME hunt rather than costing a second one,
      # so recording the proof is free here.
      - run: python -m deadcanary demo --expect-dead 2 --attest

      # THE SEAM, exercised for real rather than against fixtures. The unit tests
      # prove the bookkeeping; this proves the thing an actual user does. Both
      # directions, because a claim that can only ever say HOLDS is not checking
      # anything -- it is a green light wired to nothing.
      - name: the recorded proof holds against the suite it measured
        run: python -m deadcanary demo --recheck

      - name: ...and reopens the moment a test it never saw is added
        run: |
          python - <<'PY'
          import pathlib
          p = pathlib.Path("demo/models/schema.yml")
          s = p.read_text(encoding="utf-8")
          old = "      - name: customer_id\n        description: ALIVE. Blank these upstream and this goes red.\n        tests: [not_null]"
          assert old in s, "the demo's schema.yml changed shape; this step is now testing nothing"
          p.write_text(s.replace(old, old.replace("[not_null]", "[not_null, unique]")), encoding="utf-8")
          PY
          cd demo && dbt parse --profiles-dir . && cd ..
          if python -m deadcanary demo --recheck; then
            echo "FAILED: a test nothing has ever tried to kill was added, and the"
            echo "recorded proof still reported HOLDS. The claim does not expire."
            exit 1
          fi
          echo "reopened, as it must"

  deadcanary-readme:
    name: a stranger following the deadcanary README gets a working tool
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/deadcanary
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e .[dbt]
      - run: python tools/readme_runs.py --selftest
      - run: python tools/readme_runs.py
