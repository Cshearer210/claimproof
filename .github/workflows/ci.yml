name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # Both operating systems on purpose. The worst defect this library exists to
    # catch was a checker whose paths only existed on Linux: on Windows it scanned
    # nothing, reported CLEAN, and exited 0 for months. A single-OS matrix would
    # not have caught it.
    name: test ${{ matrix.os }} py${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # No `||` fallback here on purpose. The first version of this file used
      # `pip install -e ".[dev]" || pip install -e . pytest`. The `dev` extra did
      # not exist, so pip warned and exited 0, the fallback never ran, and every
      # job failed with "No module named pytest". A step that appears to succeed
      # while doing nothing is the exact failure this project exists to catch.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Confirm pytest is actually installed
        run: python -m pytest --version

      - name: Test
        run: python -m pytest

  # The job that matters most to anyone who installs this.
  #
  # Everything above tests the SOURCE TREE. A package can pass every one of those
  # and still be broken on `pip install`, because the wheel is built by different
  # rules than the repo layout: a missing py.typed, a package left out of the
  # build config, a data file present locally and absent from the distribution.
  # Those failures only ever appear on someone else's machine.
  #
  # So this builds the real artifacts, installs the WHEEL into a clean
  # environment, and runs the suite from a directory where the source tree is not
  # importable. If this passes, `pip install agentattest` works.
  installed:
    name: wheel installs and works from clean env (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Install the wheel into a clean environment
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/clean"
          if [ -f "$RUNNER_TEMP/clean/bin/python" ]; then
            PY="$RUNNER_TEMP/clean/bin/python"
          else
            PY="$RUNNER_TEMP/clean/Scripts/python.exe"
          fi
          echo "CLEANPY=$PY" >> "$GITHUB_ENV"
          "$PY" -m pip install --upgrade pip pytest
          "$PY" -m pip install dist/*.whl

      - name: Import and run from OUTSIDE the source tree
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/elsewhere"
          cd "$RUNNER_TEMP/elsewhere"
          "$CLEANPY" -c "
          import agentattest
          assert 'site-packages' in agentattest.__file__, agentattest.__file__
          from agentattest import Gate, Case, Finding, Harness, SelftestError
          from agentattest import ClaimBasis, Evidence, Status, BasisError
          from agentattest import Coverage, CoverageError, Diff, Entry
          from agentattest.gates import UnbackedClaims, TypedScope, SilentSkip
          from agentattest.hooks import stop_hook, pre_tool_use_hook, gate_invariant
          g = UnbackedClaims()
          assert g.verify()
          assert g.check('It works.'), 'installed package failed to flag an unbacked claim'
          assert g.check('It works. exit=0') == [], 'installed package false-positived'
          assert ClaimBasis.selftest(echo=False), 'installed ClaimBasis cannot prove itself'
          assert Coverage.selftest(echo=False), 'installed Coverage cannot prove itself'
          t = TypedScope(); assert t.verify()
          assert t.check('roots = [\"/srv/a\", \"/opt/b\"]'), 'TypedScope missed a typed population'
          assert t.check('LOGFILE = \"/var/log/app.log\"') == [], 'TypedScope false-positived'
          s = SilentSkip(); assert s.verify()
          swallowed = 'def check():' + chr(10) + '    try:' + chr(10) + '        return verify()' + chr(10) + '    except Exception:' + chr(10) + '        return True'
          honest = swallowed.replace('return True', 'return False')
          assert s.check(swallowed), 'SilentSkip missed a swallowed check'
          assert s.check(honest) == [], 'SilentSkip false-positived'
          print('installed package: public API reachable and behaving')
          "

      - name: A partial scan must not exit 0 from the installed package
        shell: bash
        run: |
          cd "$RUNNER_TEMP/elsewhere"
          if "$CLEANPY" -m agentattest.coverage; then
            echo "FAIL: 2 of 7 examined with 0 broken exited 0"
            exit 1
          fi
          echo "installed package refused to call a partial scan clean"

      - name: The installed ClaimBasis must still catch a claim going stale
        shell: bash
        run: |
          cd "$RUNNER_TEMP/elsewhere"
          echo green > proof.txt
          "$CLEANPY" -m agentattest.basis --store c.json --record "the suite passes" --evidence proof.txt
          "$CLEANPY" -m agentattest.basis --store c.json
          echo red > proof.txt
          if "$CLEANPY" -m agentattest.basis --store c.json; then
            echo "FAIL: the installed package did not reopen a claim whose evidence changed"
            exit 1
          fi
          echo "installed package reopened a stale claim, exit non-zero as required"

      - name: The advertised demo command must work
        shell: bash
        run: cd "$RUNNER_TEMP/elsewhere" && "$CLEANPY" -m agentattest.demo

      - name: python -m agentattest must work too
        shell: bash
        run: cd "$RUNNER_TEMP/elsewhere" && "$CLEANPY" -m agentattest

      - name: py.typed must ship, or downstream type checking silently does nothing
        shell: bash
        run: |
          "$CLEANPY" -c "
          import importlib.util, pathlib
          spec = importlib.util.find_spec('agentattest')
          p = pathlib.Path(spec.origin).parent / 'py.typed'
          assert p.exists(), 'py.typed missing from the installed package'
          print('py.typed ships:', p)
          "

      - name: Run the test suite against the INSTALLED package
        shell: bash
        run: |
          cp -r tests "$RUNNER_TEMP/elsewhere/tests"
          cd "$RUNNER_TEMP/elsewhere"
          "$CLEANPY" -m pytest tests -q
