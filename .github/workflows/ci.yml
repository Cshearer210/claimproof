name: CI

on:
  push: { branches: [main] }
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      - run: pip install -e .[dev]
      - run: pytest tests -q

  # The suite above runs against the source tree. This proves the PACKAGE works:
  # a wheel is built by different rules than the repo layout, so a file present
  # locally can be absent from the distribution and nothing local notices.
  installed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install build && python -m build
      - name: install the wheel somewhere the source tree is not importable
        run: |
          mkdir -p /tmp/elsewhere && cd /tmp/elsewhere
          pip install "$GITHUB_WORKSPACE"/dist/*.whl
          python -c "import deadcanary; assert 'site-packages' in deadcanary.__file__, deadcanary.__file__; print(deadcanary.__version__)"
          python -m deadcanary --help

  # The demo is the first thing a stranger runs. If it stops finding the two dead
  # canaries planted in it, either the tool broke or the demo did -- and either way
  # the README is then lying to everyone who reads it.
  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e .[dbt]
      - name: build the demo warehouse
        run: cd demo && dbt build --profiles-dir .
      - name: the demo must still find its planted dead canaries
        run: python -m deadcanary demo --expect-dead 2

  # Nothing else here reads the README. Documentation rots on its own schedule:
  # a quickstart can name a flag renamed two releases ago while every test passes.
  # This types what the README says and fails if it does not work.
  readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e .[dbt]
      - run: python tools/readme_runs.py --selftest
      - run: python tools/readme_runs.py
