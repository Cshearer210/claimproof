<rect width="753" height="1055" rx="9" fill="#0d1117"/>
<path d="M0 9a9 9 0 0 1 9-9h735a9 9 0 0 1 9 9v27H0z" fill="#161b22"/>
<circle cx="22" cy="18" r="5.5" fill="#ff5f57"/>
<circle cx="42" cy="18" r="5.5" fill="#febc2e"/>
<circle cx="62" cy="18" r="5.5" fill="#28c840"/>
<text class="l" x="376" y="23" fill="#8b949e" text-anchor="middle">deadcanary .</text>
<text class="l r0" x="18" y="67" fill="#c9d1d9">Every test below is GREEN right now. That is the claim being checked.</text>
<text class="l r1" x="18" y="88" fill="#8b949e">========================================================================</text>
<text class="l r2" x="18" y="109" fill="#8b949e"></text>
<text class="l r3" x="18" y="130" fill="#c9d1d9">  7 test(s) in the suite, 7 green before we touch anything</text>
<text class="l r4" x="18" y="151" fill="#c9d1d9">  not aiming at 0 table(s) dbt rebuilds: </text>
<text class="l r5" x="18" y="172" fill="#c9d1d9">  4 column(s) discovered, 14 corruption(s) to try</text>
<text class="l r6" x="18" y="193" fill="#8b949e"></text>
<text class="l r7" x="18" y="214" fill="#3fb950">  [  1/14] caught  blank_required on raw_orders.id</text>
<text class="l r8" x="18" y="235" fill="#3fb950">  [  2/14] caught  duplicate_key on raw_orders.id</text>
<text class="l r9" x="18" y="256" fill="#f85149" font-weight="bold">  [  3/14] MISSED  drop_rows on raw_orders.id</text>
<text class="l r10" x="18" y="277" fill="#f85149" font-weight="bold">  [  4/14] MISSED  empty_table on raw_orders.id</text>
<text class="l r11" x="18" y="298" fill="#3fb950">  [  5/14] caught  break_reference on raw_orders.id</text>
<text class="l r12" x="18" y="319" fill="#f85149" font-weight="bold">  [  6/14] MISSED  negative_amount on raw_orders.id</text>
<text class="l r13" x="18" y="340" fill="#3fb950">  [  7/14] caught  blank_required on raw_orders.customer_id</text>
<text class="l r14" x="18" y="361" fill="#f85149" font-weight="bold">  [  8/14] MISSED  break_reference on raw_orders.customer_id</text>
<text class="l r15" x="18" y="382" fill="#f85149" font-weight="bold">  [  9/14] MISSED  negative_amount on raw_orders.customer_id</text>
<text class="l r16" x="18" y="403" fill="#f85149" font-weight="bold">  [ 10/14] MISSED  blank_required on raw_orders.status</text>
<text class="l r17" x="18" y="424" fill="#f85149" font-weight="bold">  [ 11/14] MISSED  unexpected_category on raw_orders.status</text>
<text class="l r18" x="18" y="445" fill="#f85149" font-weight="bold">  [ 12/14] MISSED  blank_required on raw_orders.amount</text>
<text class="l r19" x="18" y="466" fill="#f85149" font-weight="bold">  [ 13/14] MISSED  break_reference on raw_orders.amount</text>
<text class="l r20" x="18" y="487" fill="#f85149" font-weight="bold">  [ 14/14] MISSED  negative_amount on raw_orders.amount</text>
<text class="l r21" x="18" y="508" fill="#8b949e"></text>
<text class="l r22" x="18" y="529" fill="#8b949e">========================================================================</text>
<text class="l r23" x="18" y="550" fill="#f85149" font-weight="bold">  2 of 7 green tests are DEAD CANARIES (29%)</text>
<text class="l r24" x="18" y="571" fill="#c9d1d9">  No corruption in the catalogue could make them fail.</text>
<text class="l r25" x="18" y="592" fill="#8b949e">========================================================================</text>
<text class="l r26" x="18" y="613" fill="#8b949e"></text>
<text class="l r27" x="18" y="634" fill="#c9d1d9">  Tests that cannot fail:</text>
<text class="l r28" x="18" y="655" fill="#c9d1d9">    x test.deadcanary_demo.accepted_values_stg_orders_status__placed__shipped__completed</text>
<text class="l r29" x="18" y="676" fill="#c9d1d9">      .b263cf4045</text>
<text class="l r30" x="18" y="697" fill="#c9d1d9">    x test.deadcanary_demo.not_null_orders_amount.106140f9fd</text>
<text class="l r31" x="18" y="718" fill="#8b949e"></text>
<text class="l r32" x="18" y="739" fill="#c9d1d9">  10 corruption(s) NOTHING caught -- real damage, suite still green:</text>
<text class="l r33" x="18" y="760" fill="#f85149">    ! 3 rows of raw_orders never arrive, and nothing errors</text>
<text class="l r34" x="18" y="781" fill="#f85149">    ! raw_orders is empty -- the load never ran, and the table still exists</text>
<text class="l r35" x="18" y="802" fill="#f85149">    ! id comes through negative, reversing the sign</text>
<text class="l r36" x="18" y="823" fill="#f85149">    ! 3 rows point at a customer_id that does not exist anywhere</text>
<text class="l r37" x="18" y="844" fill="#f85149">    ! customer_id comes through negative, reversing the sign</text>
<text class="l r38" x="18" y="865" fill="#f85149">    ! 3 rows arrive with status empty</text>
<text class="l r39" x="18" y="886" fill="#f85149">    ! status starts arriving as an unagreed value from upstream</text>
<text class="l r40" x="18" y="907" fill="#f85149">    ! 3 rows arrive with amount empty</text>
<text class="l r41" x="18" y="928" fill="#f85149">    ! 3 rows point at a amount that does not exist anywhere</text>
<text class="l r42" x="18" y="949" fill="#f85149">    ! amount comes through negative, reversing the sign</text>
<text class="l r43" x="18" y="970" fill="#8b949e"></text>
<text class="l r44" x="18" y="991" fill="#c9d1d9">  14 corruption(s) actually applied, 4 caught, in 260.1s.</text>
<text class="l r45" x="18" y="1012" fill="#8b949e"></text>
<text class="l r46" x="18" y="1033" fill="#c9d1d9">Two of those tests were planted to be undetectable. It found 2.</text>
</svg>
