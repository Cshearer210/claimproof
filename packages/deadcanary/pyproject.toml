[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deadcanary"
version = "0.1.0"
description = "Find the data tests that cannot fail. Mutation testing for dbt data quality."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Christopher Shearer", email = "cshearer210@gmail.com" }]
keywords = ["dbt", "data-quality", "mutation-testing", "testing", "duckdb", "analytics-engineering"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Database",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Testing",
]
# claimproof is the other half of this idea and it carries no dependencies of its
# own: it holds a claim of success to evidence a machine can check, and a
# deadcanary run is what makes "the data tests pass" mean anything. `gate.py` is
# the seam. See README, "The two halves".
# PyYAML reads the dbt profile, which is the only authority on where the
# warehouse actually is. dbt brings it along, so it was invisible on a machine
# with dbt installed and absent in CI -- where the profile reading silently did
# nothing and the tool went back to guessing. Declared, so it cannot be absent.
dependencies = ["duckdb>=1.0", "claimproof>=0.13", "pyyaml>=6"]

[project.optional-dependencies]
dbt = ["dbt-duckdb>=1.9"]
dev = ["pytest>=8"]

# Without these, the PyPI page for this package carries no link to anything --
# a stranger who finds it has no way back to the source, the findings, or a place
# to report a bug. Written before the first release rather than noticed after it.
[project.urls]
Homepage = "https://github.com/Cshearer210/claimproof/tree/main/packages/deadcanary"
Findings = "https://github.com/Cshearer210/claimproof/blob/main/packages/deadcanary/FINDINGS.md"
Issues = "https://github.com/Cshearer210/claimproof/issues"
Source = "https://github.com/Cshearer210/claimproof"

[project.scripts]
deadcanary = "deadcanary.__main__:main"

[tool.setuptools]
packages = ["deadcanary"]
package-dir = { "" = "src" }
