[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deadcanary"
version = "0.1.1"
description = "Find the data tests that cannot fail. Mutation testing for dbt data quality."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Christopher Shearer", email = "cshearer210@gmail.com" }]
keywords = ["dbt", "data-quality", "mutation-testing", "testing", "duckdb", "analytics-engineering"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Database",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Testing",
]
# claimproof is the other half of this idea and it carries no dependencies of its
# own: it holds a claim of success to evidence a machine can check, and a
# deadcanary run is what makes "the data tests pass" mean anything. `gate.py` is
# the seam. See README, "The two halves".
# PyYAML reads the dbt profile, which is the only authority on where the
# warehouse actually is. dbt brings it along, so it was invisible on a machine
# with dbt installed and absent in CI -- where the profile reading silently did
# nothing and the tool went back to guessing. Declared, so it cannot be absent.
dependencies = ["duckdb>=1.0", "claimproof>=0.13", "pyyaml>=6"]

[project.optional-dependencies]
dbt = ["dbt-duckdb>=1.9"]
# `demo` is deliberately the SAME set as `dbt`, not a second list: `python -m
# deadcanary.demo` performs a real dbt run, so what it needs is exactly what
# the dbt extra already installs. Named separately because "I want to try it"
# and "I have a dbt project" are different sentences to a reader.
demo = ["dbt-duckdb>=1.9"]
dev = ["pytest>=8"]

# Without these, the PyPI page for this package carries no link to anything --
# a stranger who finds it has no way back to the source, the findings, or a place
# to report a bug. Written before the first release rather than noticed after it.
[project.urls]
Homepage = "https://github.com/Cshearer210/claimproof/tree/main/packages/deadcanary"
Findings = "https://github.com/Cshearer210/claimproof/blob/main/packages/deadcanary/FINDINGS.md"
Issues = "https://github.com/Cshearer210/claimproof/issues"
Source = "https://github.com/Cshearer210/claimproof"

[project.scripts]
deadcanary = "deadcanary.__main__:main"

[tool.setuptools]
packages = ["deadcanary"]
package-dir = { "" = "src" }

# The demo dbt project is DATA, not code. MEASURED, not assumed: on setuptools
# 80 with pyproject config, `include-package-data` defaults to true and these
# files ship whether or not this section exists -- both wheels were built and
# opened to check. It stays anyway, because that default is a setuptools
# version's behaviour and not a promise, and being explicit costs nothing.
# What actually guards it is tests/test_packaged_demo.py, which opens a BUILT
# wheel. That test must build from a pristine copy: built in place it passed
# with the files deleted, because a stale build/lib from an earlier run was
# what it was really measuring.
[tool.setuptools.package-data]
deadcanary = ["_demo/*.yml", "_demo/models/*", "_demo/seeds/*"]
